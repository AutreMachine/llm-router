services:
  llm-router:
    image:
      - "autremachine/llm-router:latest"
    container_name: llm-router
    build: .
    ports:
      - "8000:8000"   # OpenAI-compatible API
      - "8001:8001"   # Admin console
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./router_metrics.db:/config/router_metrics.db
    restart: unless-stopped
